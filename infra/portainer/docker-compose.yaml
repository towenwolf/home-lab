networks:
  homelab-shared:
    external: true

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "0.0.0.0:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /mnt/d/portainer/data:/data
    networks:
      - homelab-shared
