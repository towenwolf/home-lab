networks:
  homelab-shared:
    external: true

services:
  web-sankey:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: web-sankey
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: dw-postgres
      POSTGRES_PORT: 5432
    ports:
      - "0.0.0.0:8080:8000"
    volumes:
      - ./static:/app/static:ro
    networks:
      - homelab-shared
