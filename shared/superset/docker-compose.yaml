services:
  superset-postgres:
    image: postgres:15
    container_name: superset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /mnt/d/superset/postgres:/var/lib/postgresql/data
    networks:
      - homelab-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-redis:
    image: redis:7
    container_name: superset-redis
    restart: unless-stopped
    volumes:
      - /mnt/d/superset/redis:/data
    networks:
      - homelab-shared
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    build: .
    image: homelab-superset:latest
    container_name: superset
    restart: unless-stopped
    ports:
      - "0.0.0.0:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@superset-postgres:5432/${POSTGRES_DB}
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-false}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - /mnt/d/superset/data:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - homelab-shared
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy

  superset-init:
    build: .
    image: homelab-superset:latest
    container_name: superset-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@superset-postgres:5432/${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - /mnt/d/superset/data:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - homelab-shared
    depends_on:
      superset-postgres:
        condition: service_healthy
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username $${ADMIN_USERNAME} --firstname Admin --lastname User --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} || true &&
        superset init
      "
    restart: "no"

networks:
  homelab-shared:
    external: true
